const grid=document.getElementById('grid'),tabs=document.querySelectorAll('.tab'),title=document.getElementById('title');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(type){
    const items=menuItems.filter(x=>x.category===type);
    grid.innerHTML='';
    title.textContent=type==='pizza'?'🍕 البيتزا':type==='drinks'?'🥤 المشروبات':'🥪 الساندويشات';
    if(!items.length){grid.innerHTML='<div class="empty">لا توجد منتجات في هذا القسم حالياً.</div>';return}
    items.forEach((x,i)=>{
        const c=document.createElement('article');
        c.className='card';
        c.innerHTML=`<div class="photo"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="${i<3?'eager':'lazy'}" onerror="this.onerror=null;this.src='https://via.placeholder.com/800x500/8f2020/ffffff?text=WONDER+FOODS'"><span class="badge">${type==='pizza'?'PIZZA':type==='drinks'?'DRINK':'SANDWICH'}</span></div><div class="info"><h3 class="name">${esc(x.name)}</h3><p class="desc">${esc(x.description)}</p><div class="bottom"><span class="price">${esc(x.price)}</span><span class="brand">WONDER FOODS</span></div></div>`;
        grid.appendChild(c);
    });
}
tabs.forEach(b=>b.onclick=()=>{
    const type=b.dataset.type;
    tabs.forEach(x=>x.classList.toggle('active',x===b));
    render(type);
    requestAnimationFrame(()=>{
        const first=grid.querySelector('.card');
        if(first){
            const off=innerWidth<=600?82:100;
            scrollTo({top:Math.max(0,first.getBoundingClientRect().top+scrollY-off),behavior:'smooth'});
        }
    });
});

/* ===== Pop-up Instagram Logic ===== */
(function(){
    const closeBtn=document.getElementById('close-follow'),msg=document.getElementById('follow-message');
    if(!closeBtn||!msg)return;
    if(localStorage.getItem('wonderInstaClosed')==='true'){msg.style.display='none';return}
    closeBtn.addEventListener('click',function(){
        msg.style.transition='opacity .4s,transform .4s';
        msg.style.opacity='0';
        msg.style.transform='translateY(50px) scale(.9)';
        setTimeout(()=>{msg.style.display='none';localStorage.setItem('wonderInstaClosed','true')},400);
    });
    setTimeout(()=>{
        if(msg.style.display!=='none'){
            msg.style.transition='opacity .5s,transform .5s';
            msg.style.opacity='0';
            msg.style.transform='translateY(50px) scale(.9)';
            setTimeout(()=>{msg.style.display='none'},500);
        }
    },12000);
})();
